<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-berlin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#030304"/>
    </linearGradient>
    <linearGradient id="yellow-berlin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow-berlin" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="320" height="180" rx="16" fill="url(#bg-berlin)"/>
  <rect x="1.5" y="1.5" width="317" height="177" rx="14.5" fill="none" stroke="#facc15" stroke-width="1.8" stroke-opacity="0.35"/>

  <!-- Silueta de la torre de telecomunicaciones de Berlín (Fernsehturm) de fondo -->
  <g opacity="0.14" stroke="#facc15" stroke-width="2" fill="none">
    <!-- Eje vertical -->
    <line x1="82" y1="15" x2="82" y2="165"/>
    <circle cx="82" cy="70" r="14" fill="#18181b"/>
    <line x1="72" y1="165" x2="82" y2="110"/>
    <line x1="92" y1="165" x2="82" y2="110"/>
  </g>

  <!-- Emblema Principal: Jazz 106.8 Oficial Berlín -->
  <g transform="translate(38, 42)">
    <circle cx="44" cy="48" r="42" fill="#ca8a04" opacity="0.3" filter="url(#glow-berlin)"/>
    <rect width="88" height="96" rx="22" fill="#18181b" stroke="#facc15" stroke-width="3"/>
    
    <!-- Texto central estilizado -->
    <text x="44" y="44" fill="#ffffff" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="1">JAZZ</text>
    <text x="44" y="66" fill="#facc15" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="-0.5">106.8</text>
    
    <!-- Mini badge inferior -->
    <rect x="18" y="74" width="52" height="12" rx="4" fill="#facc15"/>
    <text x="44" y="83" fill="#000000" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="900" text-anchor="middle" letter-spacing="0.8">BERLIN</text>
  </g>

  <!-- Tipografía JazzRadio -->
  <g transform="translate(142, 44)">
    <text x="0" y="24" fill="#ffffff" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="-0.5">JAZZRADIO</text>
    
    <!-- Píldora -->
    <rect x="0" y="34" width="136" height="23" rx="7" fill="url(#yellow-berlin)"/>
    <text x="68" y="50" fill="#000000" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1.2">106.8 FM BERLIN</text>

    <!-- Subtítulo -->
    <text x="0" y="76" fill="#fef08a" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">COOL JAZZ &amp; URBAN SWING</text>
    <text x="0" y="93" fill="#cbd5e1" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="500" opacity="0.9">THE SOUND OF BERLIN CITY</text>
  </g>
</svg>
