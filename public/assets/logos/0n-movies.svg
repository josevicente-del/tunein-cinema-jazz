<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-0n" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051410"/>
      <stop offset="50%" stop-color="#0a2a20"/>
      <stop offset="100%" stop-color="#020907"/>
    </linearGradient>
    <linearGradient id="emerald-0n" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow-0n" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="320" height="180" rx="16" fill="url(#bg-0n)"/>
  <rect x="1.5" y="1.5" width="317" height="177" rx="14.5" fill="none" stroke="#10b981" stroke-width="1.8" stroke-opacity="0.35"/>

  <!-- Líneas geométricas de radar cinematográfico -->
  <g opacity="0.12" stroke="#34d399" stroke-width="1.5" fill="none">
    <circle cx="82" cy="90" r="48"/>
    <circle cx="82" cy="90" r="76"/>
    <line x1="82" y1="10" x2="82" y2="170"/>
  </g>

  <!-- Emblema Principal: Insignia 0N -->
  <g transform="translate(38, 42)">
    <circle cx="44" cy="48" r="42" fill="#059669" opacity="0.3" filter="url(#glow-0n)"/>
    <rect width="88" height="96" rx="22" fill="url(#emerald-0n)"/>
    
    <!-- Círculo interior con 0N icónico -->
    <circle cx="44" cy="48" r="30" fill="#061c16"/>
    <!-- Texto 0N -->
    <text x="32" y="56" fill="#34d399" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="-1">0</text>
    <text x="50" y="56" fill="#ffffff" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="-1">N</text>
  </g>

  <!-- Tipografía 0N Movies -->
  <g transform="translate(142, 44)">
    <text x="0" y="24" fill="#ffffff" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="-0.5">0N MOVIES</text>
    
    <!-- Píldora -->
    <rect x="0" y="34" width="138" height="23" rx="7" fill="url(#emerald-0n)"/>
    <text x="69" y="50" fill="#020907" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1.2">FILM SOUNDTRACKS</text>

    <!-- Subtítulo -->
    <text x="0" y="76" fill="#a7f3d0" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.4">HOLLYWOOD &amp; CULT CINEMA</text>
    <text x="0" y="93" fill="#6ee7b7" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="500" opacity="0.9">BERLIN SOUNDTRACK NETWORK</text>
  </g>
</svg>
