<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-rc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240c03"/>
      <stop offset="50%" stop-color="#4d1b06"/>
      <stop offset="100%" stop-color="#140501"/>
    </linearGradient>
    <linearGradient id="gold-rc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow-rc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="320" height="180" rx="16" fill="url(#bg-rc)"/>
  <rect x="1.5" y="1.5" width="317" height="177" rx="14.5" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-opacity="0.35"/>

  <!-- Líneas de pentagrama y armónicos de fondo -->
  <g opacity="0.12" stroke="#fbbf24" stroke-width="1.5">
    <line x1="20" y1="65" x2="300" y2="65"/>
    <line x1="20" y1="75" x2="300" y2="75"/>
    <line x1="20" y1="85" x2="300" y2="85"/>
    <line x1="20" y1="95" x2="300" y2="95"/>
    <line x1="20" y1="105" x2="300" y2="105"/>
  </g>

  <!-- Emblema Principal: Lira / Clave musical dorada -->
  <g transform="translate(38, 42)">
    <circle cx="44" cy="48" r="42" fill="#d97706" opacity="0.3" filter="url(#glow-rc)"/>
    <rect width="88" height="96" rx="22" fill="url(#gold-rc)"/>
    
    <!-- Lira y cuerda sinfónica -->
    <path d="M30 32 C30 52 38 66 44 66 C50 66 58 52 58 32" fill="none" stroke="#3b1704" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="38" y1="34" x2="38" y2="62" stroke="#3b1704" stroke-width="2.5"/>
    <line x1="44" y1="34" x2="44" y2="64" stroke="#3b1704" stroke-width="2.5"/>
    <line x1="50" y1="34" x2="50" y2="62" stroke="#3b1704" stroke-width="2.5"/>
    <line x1="24" y1="30" x2="64" y2="30" stroke="#3b1704" stroke-width="5" stroke-linecap="round"/>
    <rect x="36" y="66" width="16" height="12" rx="3" fill="#3b1704"/>
  </g>

  <!-- Tipografía Oficial de Radio Clásica -->
  <g transform="translate(142, 44)">
    <text x="0" y="24" fill="#ffffff" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="23" font-weight="900" letter-spacing="-0.5">RADIO CLÁSICA</text>
    
    <!-- Píldora de Especialidad -->
    <rect x="0" y="34" width="132" height="23" rx="7" fill="url(#gold-rc)"/>
    <text x="66" y="50" fill="#240c03" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1.2">BANDAS SONORAS</text>

    <!-- Subtítulos de sinfonía y cine -->
    <text x="0" y="76" fill="#fef08a" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">RNE · CINE &amp; SINFONÍA</text>
    <text x="0" y="93" fill="#fde047" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="500" opacity="0.9">ORQUESTAS &amp; COMPOSITORES</text>
  </g>
</svg>
