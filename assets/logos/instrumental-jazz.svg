<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-inst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160e29"/>
      <stop offset="50%" stop-color="#2d1b54"/>
      <stop offset="100%" stop-color="#0c0717"/>
    </linearGradient>
    <linearGradient id="purple-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="glow-inst" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="320" height="180" rx="16" fill="url(#bg-inst)"/>
  <rect x="1.5" y="1.5" width="317" height="177" rx="14.5" fill="none" stroke="#a855f7" stroke-width="1.8" stroke-opacity="0.35"/>

  <!-- Líneas de mástil de contrabajo y resonancia -->
  <g opacity="0.12" stroke="#d8b4fe" stroke-width="1.5">
    <line x1="20" y1="40" x2="300" y2="40"/>
    <line x1="20" y1="60" x2="300" y2="60"/>
    <line x1="20" y1="120" x2="300" y2="120"/>
    <line x1="20" y1="140" x2="300" y2="140"/>
  </g>

  <!-- Emblema Principal: Contrabajo y Teclado de Piano Acústico -->
  <g transform="translate(38, 42)">
    <circle cx="44" cy="48" r="42" fill="#7e22ce" opacity="0.3" filter="url(#glow-inst)"/>
    <rect width="88" height="96" rx="22" fill="url(#purple-badge)"/>
    
    <!-- Contrabajo Acústico de Jazz -->
    <!-- Caja armónica -->
    <path d="M44 20 C36 20 32 26 32 34 C32 40 36 44 40 46 C34 49 30 55 30 64 C30 74 36 80 44 80 C52 80 58 74 58 64 C58 55 54 49 48 46 C52 44 56 40 56 34 C56 26 52 20 44 20 Z" fill="#1e1035"/>
    <!-- Mástil y clavijero -->
    <line x1="44" y1="14" x2="44" y2="78" stroke="#f3e8ff" stroke-width="2.5"/>
    <circle cx="44" cy="14" r="3" fill="#f3e8ff"/>
    <!-- Efes del contrabajo -->
    <path d="M36 58 C36 62 38 64 40 64" fill="none" stroke="#d8b4fe" stroke-width="2"/>
    <path d="M52 58 C52 62 50 64 48 64" fill="none" stroke="#d8b4fe" stroke-width="2"/>
  </g>

  <!-- Tipografía Instrumental Jazz -->
  <g transform="translate(142, 44)">
    <text x="0" y="24" fill="#ffffff" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="22" font-weight="900" letter-spacing="-0.5">INSTRUMENTAL</text>
    
    <!-- Píldora -->
    <rect x="0" y="34" width="112" height="23" rx="7" fill="url(#purple-badge)"/>
    <text x="56" y="50" fill="#ffffff" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1.2">JAZZ SOLO HD</text>

    <!-- Subtítulo -->
    <text x="0" y="76" fill="#e9d5ff" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">ACOUSTIC PIANO &amp; BASS</text>
    <text x="0" y="93" fill="#c084fc" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="500" opacity="0.9">PURE JAZZ WITHOUT VOCALS</text>
  </g>
</svg>
