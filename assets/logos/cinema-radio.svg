<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cinema-radio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="crimson-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="glow-cinema" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="320" height="180" rx="16" fill="url(#bg-cinema-radio)"/>
  <rect x="1.5" y="1.5" width="317" height="177" rx="14.5" fill="none" stroke="#ef4444" stroke-width="1.8" stroke-opacity="0.35"/>

  <!-- Icono de Carrete y Claqueta -->
  <g transform="translate(36, 42)">
    <circle cx="44" cy="48" r="42" fill="#ef4444" opacity="0.3" filter="url(#glow-cinema)"/>
    <rect width="88" height="96" rx="22" fill="url(#crimson-grad)"/>
    
    <!-- Bobina / Rollo de Película -->
    <circle cx="44" cy="48" r="26" fill="#0f172a"/>
    <circle cx="44" cy="48" r="12" fill="#ef4444"/>
    <circle cx="44" cy="48" r="5" fill="#ffffff"/>
    <circle cx="44" cy="30" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="44" cy="66" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="26" cy="48" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="62" cy="48" r="4" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Tipografía Cinema Radio -->
  <g transform="translate(142, 44)">
    <text x="0" y="24" fill="#ffffff" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="23" font-weight="900" letter-spacing="-0.5">CINEMA RADIO</text>
    
    <!-- Píldora de dial -->
    <rect x="0" y="34" width="138" height="20" rx="10" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-opacity="0.4"/>
    <text x="8" y="48" fill="#fca5a5" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.5">MADRID · 192 KBPS</text>
    
    <text x="0" y="76" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600">Bandas Sonoras 24/7</text>
    <text x="0" y="94" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10.5" font-weight="400">Cine · Series · Ambient</text>
  </g>
</svg>
