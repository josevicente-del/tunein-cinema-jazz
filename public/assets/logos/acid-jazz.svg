<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-acid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041d0e"/>
      <stop offset="50%" stop-color="#0d3b1d"/>
      <stop offset="100%" stop-color="#02140a"/>
    </linearGradient>
    <linearGradient id="lime-acid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
    <filter id="glow-acid" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="320" height="180" rx="16" fill="url(#bg-acid)"/>
  <rect x="1.5" y="1.5" width="317" height="177" rx="14.5" fill="none" stroke="#a3e635" stroke-width="1.8" stroke-opacity="0.35"/>

  <!-- Ondas concéntricas de vinilo de fondo -->
  <g opacity="0.12" stroke="#bef264" stroke-width="1.5" fill="none">
    <circle cx="82" cy="90" r="35"/>
    <circle cx="82" cy="90" r="55"/>
    <circle cx="82" cy="90" r="75"/>
    <circle cx="82" cy="90" r="95"/>
  </g>

  <!-- Emblema Principal: Vinilo Psicodélico Acid Jazz -->
  <g transform="translate(38, 42)">
    <circle cx="44" cy="48" r="42" fill="#65a30d" opacity="0.3" filter="url(#glow-acid)"/>
    <rect width="88" height="96" rx="22" fill="url(#lime-acid)"/>
    
    <!-- Disco de Vinilo -->
    <circle cx="44" cy="48" r="32" fill="#041d0e"/>
    <!-- Surcos del vinilo -->
    <circle cx="44" cy="48" r="26" fill="none" stroke="#166534" stroke-width="1"/>
    <circle cx="44" cy="48" r="20" fill="none" stroke="#166534" stroke-width="1"/>
    <!-- Etiqueta central verde lima -->
    <circle cx="44" cy="48" r="12" fill="#a3e635"/>
    <circle cx="44" cy="48" r="3" fill="#041d0e"/>
  </g>

  <!-- Tipografía 100% ACID JAZZ -->
  <g transform="translate(142, 44)">
    <text x="0" y="24" fill="#ffffff" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="22" font-weight="900" letter-spacing="-0.5">100% ACID JAZZ</text>
    
    <!-- Píldora -->
    <rect x="0" y="34" width="130" height="23" rx="7" fill="url(#lime-acid)"/>
    <text x="65" y="50" fill="#041d0e" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1.2">FUNK &amp; GROOVE</text>

    <!-- Subtítulo -->
    <text x="0" y="76" fill="#d9f99d" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.3">RARE GROOVE &amp; UNDERGROUND</text>
    <text x="0" y="93" fill="#bef264" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="500" opacity="0.9">LONDON CLUB SESSIONS</text>
  </g>
</svg>
