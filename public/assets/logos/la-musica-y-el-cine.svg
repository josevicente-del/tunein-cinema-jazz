<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-musica-cine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="rtve-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="glow-rtve" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="320" height="180" rx="16" fill="url(#bg-musica-cine)"/>
  <rect x="1.5" y="1.5" width="317" height="177" rx="14.5" fill="none" stroke="#e11d48" stroke-width="1.8" stroke-opacity="0.35"/>

  <!-- Emblema de Disco de Vinilo y Nota Musical -->
  <g transform="translate(36, 42)">
    <circle cx="44" cy="48" r="42" fill="#e11d48" opacity="0.3" filter="url(#glow-rtve)"/>
    <rect width="88" height="96" rx="22" fill="url(#rtve-red)"/>
    
    <!-- Vinilo / Ondas -->
    <circle cx="44" cy="48" r="28" fill="#09090b"/>
    <circle cx="44" cy="48" r="20" fill="none" stroke="#3f3f46" stroke-width="1.5"/>
    <circle cx="44" cy="48" r="13" fill="none" stroke="#3f3f46" stroke-width="1.5"/>
    <circle cx="44" cy="48" r="7" fill="#e11d48"/>
    <!-- Nota Musical blanca -->
    <path d="M47 38v14.5a3.5 3.5 0 1 1-3-3.4V42l8-2.5v10.5a3.5 3.5 0 1 1-3-3.4V36z" fill="#ffffff"/>
  </g>

  <!-- Tipografía -->
  <g transform="translate(142, 44)">
    <text x="0" y="24" fill="#ffffff" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="-0.5">LA MÚSICA Y EL CINE</text>
    
    <!-- Píldora de RNE -->
    <rect x="0" y="34" width="138" height="20" rx="10" fill="#e11d48" fill-opacity="0.2" stroke="#e11d48" stroke-opacity="0.4"/>
    <text x="8" y="48" fill="#fda4af" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.5">RNE · RADIO 5 / PLAY</text>
    
    <text x="0" y="76" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600">Espacio de Bandas Sonoras</text>
    <text x="0" y="94" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10.5" font-weight="400">Dirigido por Daniel Gamboa</text>
  </g>
</svg>
