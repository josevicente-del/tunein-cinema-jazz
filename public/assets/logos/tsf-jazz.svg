<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-tsf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240a04"/>
      <stop offset="50%" stop-color="#451508"/>
      <stop offset="100%" stop-color="#120401"/>
    </linearGradient>
    <linearGradient id="terracotta-tsf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="glow-tsf" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="320" height="180" rx="16" fill="url(#bg-tsf)"/>
  <rect x="1.5" y="1.5" width="317" height="177" rx="14.5" fill="none" stroke="#ea580c" stroke-width="1.8" stroke-opacity="0.35"/>

  <!-- Rayos Art Déco parisinos de fondo -->
  <g opacity="0.1" stroke="#fdba74" stroke-width="1.8">
    <line x1="82" y1="90" x2="20" y2="20"/>
    <line x1="82" y1="90" x2="82" y2="10"/>
    <line x1="82" y1="90" x2="144" y2="20"/>
    <line x1="82" y1="90" x2="170" y2="90"/>
    <line x1="82" y1="90" x2="144" y2="160"/>
    <line x1="82" y1="90" x2="82" y2="170"/>
    <line x1="82" y1="90" x2="20" y2="160"/>
    <line x1="82" y1="90" x2="0" y2="90"/>
  </g>

  <!-- Emblema Principal: Micrófono Vintage París TSF -->
  <g transform="translate(38, 42)">
    <circle cx="44" cy="48" r="42" fill="#c2410c" opacity="0.3" filter="url(#glow-tsf)"/>
    <rect width="88" height="96" rx="22" fill="url(#terracotta-tsf)"/>
    
    <!-- Micrófono elíptico vintage -->
    <ellipse cx="44" cy="42" rx="16" ry="22" fill="#240a04"/>
    <rect x="36" y="24" width="16" height="36" rx="6" fill="#f97316"/>
    <!-- Rejilla horizontal -->
    <line x1="36" y1="32" x2="52" y2="32" stroke="#240a04" stroke-width="2"/>
    <line x1="36" y1="38" x2="52" y2="38" stroke="#240a04" stroke-width="2"/>
    <line x1="36" y1="44" x2="52" y2="44" stroke="#240a04" stroke-width="2"/>
    <line x1="36" y1="50" x2="52" y2="50" stroke="#240a04" stroke-width="2"/>
    <!-- Soporte de micrófono -->
    <path d="M22 42 C22 56 32 68 44 68 C56 68 66 56 66 42" fill="none" stroke="#ffffff" stroke-width="3"/>
    <line x1="44" y1="68" x2="44" y2="80" stroke="#ffffff" stroke-width="4"/>
    <line x1="32" y1="80" x2="56" y2="80" stroke="#ffffff" stroke-width="4"/>
  </g>

  <!-- Tipografía TSF JAZZ -->
  <g transform="translate(142, 44)">
    <text x="0" y="24" fill="#ffffff" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="25" font-weight="900" letter-spacing="-0.5">TSF JAZZ</text>
    
    <!-- Píldora -->
    <rect x="0" y="34" width="126" height="23" rx="7" fill="url(#terracotta-tsf)"/>
    <text x="63" y="50" fill="#ffffff" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1.2">89.9 FM PARIS</text>

    <!-- Subtítulo -->
    <text x="0" y="76" fill="#fed7aa" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.4">SWING, BEBOP &amp; VOCAL</text>
    <text x="0" y="93" fill="#fdba74" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="500" opacity="0.9">LA GRANDE RADIO DU JAZZ</text>
  </g>
</svg>
