<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-adroit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021c16"/>
      <stop offset="50%" stop-color="#07382d"/>
      <stop offset="100%" stop-color="#010d0a"/>
    </linearGradient>
    <linearGradient id="emerald-adroit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow-adroit" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="320" height="180" rx="16" fill="url(#bg-adroit)"/>
  <rect x="1.5" y="1.5" width="317" height="177" rx="14.5" fill="none" stroke="#34d399" stroke-width="1.8" stroke-opacity="0.35"/>

  <!-- Siluetas geométricas de rascacielos de Nueva York de fondo -->
  <g opacity="0.12" fill="#34d399">
    <rect x="20" y="80" width="12" height="70"/>
    <rect x="36" y="60" width="16" height="90"/>
    <rect x="56" y="90" width="10" height="60"/>
    <rect x="254" y="70" width="14" height="80"/>
    <rect x="272" y="55" width="18" height="95"/>
    <rect x="294" y="85" width="10" height="65"/>
  </g>

  <!-- Emblema Principal: Escudo Avant-Garde NYC -->
  <g transform="translate(38, 42)">
    <circle cx="44" cy="48" r="42" fill="#059669" opacity="0.3" filter="url(#glow-adroit)"/>
    <rect width="88" height="96" rx="22" fill="url(#emerald-adroit)"/>
    
    <!-- Símbolo geométrico Avant-Garde -->
    <circle cx="44" cy="48" r="30" fill="#021c16"/>
    <!-- Flechas cruzadas de jazz contemporáneo -->
    <path d="M30 48 L58 48 M44 34 L44 62" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <polygon points="44,28 38,36 50,36" fill="#34d399"/>
    <polygon points="44,68 38,60 50,60" fill="#34d399"/>
    <polygon points="64,48 56,42 56,54" fill="#34d399"/>
    <polygon points="24,48 32,42 32,54" fill="#34d399"/>
    <!-- Diamante central -->
    <polygon points="44,43 49,48 44,53 39,48" fill="#ffffff"/>
  </g>

  <!-- Tipografía Adroit Jazz -->
  <g transform="translate(142, 44)">
    <text x="0" y="24" fill="#ffffff" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="23" font-weight="900" letter-spacing="-0.5">ADROIT JAZZ</text>
    
    <!-- Píldora -->
    <rect x="0" y="34" width="142" height="23" rx="7" fill="url(#emerald-adroit)"/>
    <text x="71" y="50" fill="#010d0a" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1.2">UNDERGROUND HD</text>

    <!-- Subtítulo -->
    <text x="0" y="76" fill="#a7f3d0" font-family="'Inter', -apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.3">NEW YORK AVANT-GARDE</text>
    <text x="0" y="93" fill="#6ee7b7" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="500" opacity="0.9">CONTEMPORARY &amp; MODAL JAZZ</text>
  </g>
</svg>
